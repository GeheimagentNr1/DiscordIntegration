repositories {
    maven { url 'https://jitpack.io' }
    maven {
        url = 'https://maven.skaggsm.com/releases'
    }
}

dependencies {
    implementation("net.dv8tion:JDA:${jda_version}") {
        exclude module: 'opus-java'
        exclude module: 'slf4j-api'
    }
    jarJar("net.dv8tion:JDA:[${jda_version},7)") {
        jarJar.pin(it, "${jda_version}")
        transitive = false
    }
    jarJar("com.fasterxml.jackson.core:jackson-core:[2.18.2,3)") {
        jarJar.pin(it, "2.18.2")
        transitive = false
    }
    jarJar("com.fasterxml.jackson.core:jackson-annotations:[2.18.2,3)") {
        jarJar.pin(it, "2.18.2")
        transitive = false
    }
    jarJar("com.fasterxml.jackson.core:jackson-databind:[2.18.2,3)") {
        jarJar.pin(it, "2.18.2")
        transitive = false
    }
    jarJar("com.neovisionaries:nv-websocket-client:[2.14,3)") {
        jarJar.pin(it, "2.14")
        transitive = false
    }
    jarJar("com.squareup.okhttp3:okhttp:[4.12.0,5)") {
        jarJar.pin(it, "4.12.0")
        transitive = false
    }
    jarJar("com.squareup.okio:okio-jvm:[3.6.0,4)") {
        jarJar.pin(it, "3.6.0")
        transitive = false
    }
    jarJar("org.jetbrains.kotlin:kotlin-stdlib:[1.9.24,2)") {
        jarJar.pin(it, "1.9.24")
        transitive = false
    }
    jarJar("org.jetbrains:annotations:[24.0.1,25)") {
        jarJar.pin(it, "24.0.1")
        transitive = false
    }
    jarJar("net.sf.trove4j:trove4j:[3.0.3,4)") {
        jarJar.pin(it, "3.0.3")
        transitive = false
    }
    jarJar("org.apache.commons:commons-collections4:[4.4,5)") {
        jarJar.pin(it, "4.4")
        transitive = false
    }

    runtimeOnly fg.deobf("de.geheimagentnr1.dimension_access_manager:DimensionAccessManager-${minecraft_version}:${dam_version}")
    runtimeOnly fg.deobf("de.geheimagentnr1.moremobgriefingoptions:MoreMobGriefingOptions-${minecraft_version}:${mmgo_version}")
}
